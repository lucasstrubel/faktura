name: Release

# Baut bei einem Versions-Tag (v*) den Windows-Installer (MSI via jpackage,
# WiX ist auf windows-latest vorinstalliert) und veröffentlicht ihn zusammen
# mit dem Fat-JAR als GitHub-Release. Veröffentlicht wird genau das JAR, das
# die Release-Prüfungen (pruefungen.yml) gebaut und geprüft haben; der
# Abhängigkeitsscan (sicherheit.yml, braucht das Secret NVD_API_KEY) ist
# ebenfalls Voraussetzung. Manuell (workflow_dispatch) entsteht nur das MSI.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefungen:
    uses: ./.github/workflows/pruefungen.yml
  sicherheit:
    uses: ./.github/workflows/sicherheit.yml
    secrets: inherit

  installer:
    needs: [pruefungen, sicherheit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v8
        with:
          name: geprueftes-jar
          path: build/paket

      # Tag und Projektversion müssen übereinstimmen: Sonst enthielte etwa ein
      # MSI "3.0.1" das JAR faktura-3.0.0.jar. jpackage verlangt eine rein
      # numerische Version, deshalb trägt das MSI eines RC (3.1.0-rc.1) "3.1.0".
      # Das MSI enthält das geprüfte JAR im entpackten Spring-Boot-Layout
      # (tools/windows-paket-bauen.ps1, Q-04). Das installierte Paket wird
      # anschließend auf dem Runner gestartet und wieder entfernt
      # (tools/msi-pruefen.ps1).
      - name: MSI bauen und installiert starten
        shell: pwsh
        run: |
          $version = ([xml](Get-Content pom.xml)).project.version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag und POM unterscheiden sich' }
          ./tools/windows-paket-bauen.ps1 -Jar (Get-ChildItem build/paket/*.jar).FullName -Typ msi -Ziel build/installer
          ./tools/msi-pruefen.ps1 -Msi (Get-ChildItem build/installer/*.msi).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: gepruefter-installer
          path: build/installer/*.msi

  # Nur bei Tags; Schreibrechte erhält ausschließlich dieser Job.
  # Tags mit "-rc." erscheinen als Vorabversion.
  publish:
    if: github.ref_type == 'tag'
    needs: installer
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: geprueftes-jar
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: gepruefter-installer
          path: release
      - name: Gepruefte Artefakte veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            gh release create "$RELEASE_TAG" release/* --title "Faktura $RELEASE_TAG" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" release/* --title "Faktura $RELEASE_TAG" --generate-notes
          fi
