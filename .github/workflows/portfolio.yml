name: Portfolio-Windows-Pruefung
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sicherheit:
    uses: ./.github/workflows/sicherheit.yml
    secrets: inherit
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build und GUI-Regressionen
        run: ./mvnw.cmd --batch-mode --no-transfer-progress verify '-Dfaktura.gui.tests=true'
      - name: Reproduzierbarer Demobestand
        run: ./tools/portfolio-demo.ps1
      - name: Portables Paket mit gebündelter Laufzeit
        run: ./tools/windows-paket-pruefen.ps1 -Jar (Get-ChildItem target/faktura-*.jar).FullName
      - name: MSI auf disponiblem Runner installieren und entfernen
        shell: pwsh
        run: |
          ./tools/windows-paket-bauen.ps1 -Jar (Get-ChildItem target/faktura-*.jar).FullName -Typ msi -Ziel target/msi-pruefung
          ./tools/msi-pruefen.ps1 -Msi (Get-ChildItem target/msi-pruefung/*.msi).FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-pruefnachweise
          path: |
            target/surefire-reports/
            target/windows-paket-*/pruefbericht.txt
            target/portfolio-demo-*/DEMOSTAND.txt
